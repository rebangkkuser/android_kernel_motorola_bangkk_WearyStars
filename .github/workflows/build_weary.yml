
name: WearyStars Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: WearyStars - bangkk
    runs-on: ubuntu-26.04

    env:
      KBUILD_BUILD_USER: bangkkuser
      KBUILD_BUILD_HOST: ubuntu_22.04_actions
      ARCH: arm64
      SUBARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-

    steps:
      - name: Checkout kernel with submodules
        uses: actions/checkout@v4
        with:
          repository: Samw662/android_kernel_motorola_bangkk
          ref: master
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio \
            curl flex git gnupg wget \
            libelf-dev libssl-dev libncurses-dev \
            python3 python-is-python3 \
            rsync unzip zip zstd \
            device-tree-compiler dwarves \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Install Neutron Clang 18
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/neutron-clang"
          cd "$RUNNER_TEMP/neutron-clang"

          curl -fL \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
            -o antman

          chmod +x antman

          ./antman -S=05012024

          echo "$RUNNER_TEMP/neutron-clang/bin" >> "$GITHUB_PATH"

      - name: Verify Neutron Clang
        run: |
          set -e

          clang --version
          ld.lld --version
          llvm-ar --version

          clang --version | grep -E '18\.0\.0'

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
            -b bangkk \
            https://github.com/Samw662/AnyKernel3.git \
            AnyKernel3

      - name: Verify KernelSU
        run: |
          set -e
          test -f KernelSU/kernel/Kconfig
          echo "KernelSU encontrado!"
          git -C KernelSU rev-parse HEAD

      - name: Configure kernel
        run: |
          set -e

          make O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            vendor/bangkk_defconfig

          scripts/config --file out/.config \
            --set-str LOCALVERSION "-WearyStars⭐"

          make O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            olddefconfig

          echo "Kernel release:"
          make O=out -s kernelrelease

      - name: Compile kernel
        run: |
          set -e

          make -j"$(nproc)" O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz dtbs modules

      - name: Prepare AnyKernel3
        run: |
          set -e

          IMAGE="out/arch/arm64/boot/Image.gz"
          test -f "$IMAGE"

          cp "$IMAGE" AnyKernel3/Image.gz

          make -j"$(nproc)" O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/AnyKernel3/vendor_ramdisk" \
            INSTALL_MOD_STRIP=1 \
            modules_install

          if ! find AnyKernel3/vendor_ramdisk \
            -type f -name '*.ko' -print -quit | grep -q .; then
            rm -rf AnyKernel3/vendor_ramdisk
          fi

      - name: Create AnyKernel3 ZIP
        run: |
          cd AnyKernel3

          zip -r9 \
            "$GITHUB_WORKSPACE/WearyStars-bangkk.zip" . \
            -x "*.git*" \
            -x "README.md"

      - name: Generate SHA256
        run: |
          sha256sum WearyStars-bangkk.zip \
            > WearyStars-bangkk.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WearyStars-bangkk
          path: |
            WearyStars-bangkk.zip
            WearyStars-bangkk.zip.sha256
          if-no-files-found: error
          retention-days: 14
          
